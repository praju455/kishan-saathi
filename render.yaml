services:
  - type: web
    name: kishan-saathi-api
    runtime: docker
    region: singapore
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: uv run --no-sync alembic upgrade head
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: "5"
      - key: COGNITO_REGION
        value: ap-northeast-1
      - key: COGNITO_USER_POOL_ID
        value: ap-northeast-1_2tJtNxZbb
      - key: COGNITO_APP_CLIENT_ID
        sync: false
      - key: BEDROCK_MODEL_ID
        value: global.anthropic.claude-sonnet-4-6
      - key: BEDROCK_REGION
        value: ap-south-1
      - key: BEDROCK_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: kishan-saathi-private
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: AUTH_RATE_LIMIT_HMAC_KEY
        generateValue: true
      - key: LEAF_INFERENCE_BACKEND
        value: disabled
      - key: CORS_ALLOWED_ORIGINS
        sync: false
